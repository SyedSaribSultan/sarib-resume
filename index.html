    <!-- Pre-paint theme: pick the colour scheme (data-theme, read by MUI's CSS
         variables) and page background before first paint, so dark-mode users
         never see a light flash. Mirrors App.tsx palette + storage key. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-mode');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var html = document.documentElement;
          html.setAttribute('data-theme', dark ? 'dark' : 'light');
          html.style.backgroundColor = dark ? '#121211' : '#fbfbfa';
        } catch (e) {}
      })();
    </script>
